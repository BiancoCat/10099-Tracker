name: traffic-query

services:
  traffic-api:
    build:
      context: .
    container_name: traffic-api
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      TZ: Asia/Shanghai
      TRAFFIC_CONFIG_FILE: /app/data/config.json
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
